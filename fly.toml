# fly.toml app configuration file generated for noomings-backend on 2026-11-02T01:07:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'noomings-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/parking_pso.db'
  FLASK_DEBUG = 'false'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
