# Fly.io · Citywalk + Parking API
# 卷须与 primary_region 同区：fly volumes create data --region sin --size 1 -a noomings-backend

app = 'noomings-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  FLASK_DEBUG = 'false'
  DATABASE_PATH = '/data/parking_pso.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'data'
  destination = '/data'
